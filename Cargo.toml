[package]
name = "ple-engine"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "Procedural Layout Engine: context JSON -> contrast-verified, constraint-solved HTML + Tailwind/CSS"
license = "MIT"

[lib]
name = "ple_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ple"
path = "src/main.rs"

[dependencies]
# Intentionally empty: JSON, OKLCH, APCA, the LP/Cassowary-style solver and the codegen are all in-tree.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
